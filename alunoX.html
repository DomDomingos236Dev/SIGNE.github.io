<body>
  <div class="container">

    <aside class="sidebar">
        <h2>SIGNE</h2>

        <ul>
            <li><a href="menu.html">Dashboard</a></li>

            <li><a href="Notas.html">Notas</a></li>
            <li><a href="definicoes.html">Configurações</a></li>
        </ul>
    </aside>

    <main class="content">

        <header>
            <h1>Sistema Integrado de Gestão de Notas Escolares</h1>
        </header>
        
        <button style="float:right; width:130px; margin-right: 30px; margin-bottom:30px">Imprimir</button>
        
    
        <div class="caixa">
            
            <div class="infoAluno">
                <p style="font-size:35px; font-weight: bold;">Nome</p>
                <p>12 classe</p>
                <p>Informática</p>
                <p>000</p>
                <p id="situacao2"></p>
            </div>
            <div class="logo"></div>
            
    
        </div>
        
        
        
        
        
        <div class="conteudoNota">
        <h1>Média Final</h1>

<table>

<thead>
<tr>
    <th>MTI</th>
    <th>MTII</th>
    <th>MTIII</th>
    <th>MF</th>
    <th>Situação</th>
</tr>
</thead>

<tbody>

<tr>

    <td><input type="number" id="n1" min="0" max="20"></td>

    <td><input type="number" id="n2" min="0" max="20"></td>

    <td><input type="number" id="n3" min="0" max="20"></td>

    <td id="media">0</td>

    <td id="situacao">-</td>
</tr>

</tbody>

</table>

<button onclick="calcular()">Calcular Média</button>

</div>

</div>

<script>

function calcular(){

let n1 = Number(document.getElementById("n1").value);
let n2 = Number(document.getElementById("n2").value);
let n3 = Number(document.getElementById("n3").value);

let media = (n1 + n2 + n3) / 3;

document.getElementById("media").innerHTML = media.toFixed(1);

let situacao = document.getElementById("situacao");
let sutuacao2 = document.getElementById("situacao2");

if(media >= 10){

    situacao.innerHTML = "Aprovado";
    situacao.className = "aprovado";
    situacao2.innerHTML ="Aprovado";
    situacao2.className ="aprovado";
    

    
}else if(media >= 9){

    situacao.innerHTML = "Recurso";
    situacao.className = "recurso";
    situacao2.innerHTML ="Recurso";
    situacao2.className ="recurso";
}

else{

    situacao.innerHTML = "Reprovado";
    situacao.className = "reprovado";
    situacao2.innerHTML = "Reprovado";
    situacao2.className = "reprovado";

}

}

</script>

</div>
