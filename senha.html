<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Senha</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fb;
}

.card{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border:1px solid #e2e8f0;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

h2{
    color:#0f172a;
    margin-bottom:10px;
}

p{
    color:#64748b;
    margin-bottom:20px;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    margin-bottom:15px;
    outline-color:#8BC0FF;
}

button{
    width:100%;
    border:none;
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.link{
    text-align:center;
    margin-top:15px;
}

.link a{
    text-decoration:none;
    color:#2563eb;
}

</style>
</head>
<body>

<div class="card">

    <h2>Recuperar Senha</h2>

    <p>
        Informe o seu e-mail para receber
        instruções de recuperação.
    </p>

    <input
    type="email"
    placeholder="Seu endereço de E-mail" required>

    <button>
        Enviar Código
    </button>

    <div class="link">
        <a href="index.html">
            Voltar ao Login
        </a>
    </div>

</div>

</body>
</html>
